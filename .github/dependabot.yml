version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
