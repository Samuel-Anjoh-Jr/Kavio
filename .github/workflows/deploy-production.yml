name: Deploy Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run of migrate deploy + the schema-drift gate against production,
  # without needing a push — e.g. after fixing a secret the last run failed on.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.8.0'
  NODE_VERSION: '22'

jobs:
  # Answers "did this push touch packages/database/prisma" straight from the
  # push webhook payload (no checkout, no API call) so db-migrate's job-level
  # `if:` can skip booting a runner — and its Postgres+PostGIS shadow-db
  # service container — entirely when it didn't. The workflow's own `paths:`
  # trigger can't do this, since `validate` still needs to run on every
  # push/PR regardless of path.
  check-prisma-changes:
    name: Detect packages/database/prisma changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check paths from the push payload
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        shell: bash
        run: |
          # workflow_dispatch has no commit list to inspect — always run, same
          # as the deleted prisma-migrate.yml's unconditional workflow_dispatch.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail open (assume changed) on a payload shape we don't recognise,
          # rather than silently skipping a migration.
          if [ -z "$COMMITS_JSON" ] || [ "$COMMITS_JSON" = "null" ] || [ "$COMMITS_JSON" = "[]" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$COMMITS_JSON" | jq -e \
            '[.[] | (.added + .removed + .modified)[]] | any(startswith("packages/database/prisma/"))' \
            > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Install, generate, type-check, lint
    runs-on: ubuntu-latest
    env:
      # Dummy values: validate/type-check only need Prisma to parse the schema.
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/kavio?schema=public'
      DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/kavio?schema=public'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

  db-migrate:
    name: Migrate database + schema-drift gate
    needs: [validate, check-prisma-changes]
    if: >-
      needs.check-prisma-changes.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: production
    # Disposable target for the drift gate below: it replays prisma/migrations
    # from scratch and compares the result to the real DB, so drift is judged
    # against what the migrations actually produce (raw-SQL PostGIS GIST
    # indexes included) rather than against schema.prisma's declarative model,
    # which cannot represent an Unsupported-type spatial index at all.
    services:
      shadow-db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kavio_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations (prisma migrate deploy)
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Schema-drift gate (prisma migrate diff --exit-code)
        run: pnpm db:migrate:diff
        env:
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kavio_shadow?schema=public

  summary:
    name: Deployment summary
    needs: [validate, db-migrate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write step summary
        shell: bash
        run: |
          {
            echo "## Deploy Production"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| validate (install/generate/type-check/lint) | ${{ needs.validate.result }} |"
            echo "| db-migrate (migrate deploy + drift gate) | ${{ needs.db-migrate.result }} |"
            echo
            echo "This workflow only validates the app and gates schema migrations. It does not deploy"
            echo "application code: the API auto-deploys via Railway's branch integration and the web app"
            echo "auto-deploys via Vercel's Git integration, both watching \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
