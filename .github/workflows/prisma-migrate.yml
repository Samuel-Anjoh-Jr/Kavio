name: Prisma Migrate (schema-only)

on:
  push:
    branches: [main]
    paths:
      - 'packages/database/prisma/**'
  workflow_dispatch: {}

concurrency:
  group: prisma-migrate-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.8.0'
  NODE_VERSION: '22'

jobs:
  migrate-deploy:
    name: Migrate deploy + schema-drift gate
    runs-on: ubuntu-latest
    environment: production
    # Disposable target for the drift gate below: it replays prisma/migrations
    # from scratch and compares the result to the real DB, so drift is judged
    # against what the migrations actually produce (raw-SQL PostGIS GIST
    # indexes included) rather than against schema.prisma's declarative model,
    # which cannot represent an Unsupported-type spatial index at all.
    services:
      shadow-db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kavio_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Run database migrations (prisma migrate deploy)
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Schema-drift gate (prisma migrate diff --exit-code)
        run: pnpm db:migrate:diff
        env:
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kavio_shadow?schema=public
