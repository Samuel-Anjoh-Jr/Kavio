name: Mobile Release

# Builds the Kavio app (apps/mobile, Capacitor) ONLY when the version changes.
# Same release flow as ASK-O Eats. The version lives in the ROOT package.json;
# scripts/bump-version.mjs copies it into apps/api, apps/mobile and apps/web,
# and build.gradle turns it into versionName / versionCode
# (MAJOR*10000 + MINOR*100 + PATCH). The iOS build uses the same numbers.
#
# What starts a release:
#   1. A merge to main that changes the root package.json version (a PR where
#      `pnpm version:patch|minor|major` was run). If tag vX.Y.Z doesn't exist
#      yet, it is created and the release is built.
#   2. Pushing a tag yourself:  git tag v1.2.0 && git push origin v1.2.0
#      (must be on main; app versions are synced to the tag for the build).
#   3. Actions -> "Mobile Release" -> Run workflow, choosing patch / minor /
#      major (bumps, commits to main, tags, builds) or "rebuild" (rebuilds the
#      current version, no new tag).
#
# What it produces:
#   - Always: a signed Android APK as a downloadable artifact. The app is a
#     WebView shell with no native libraries, so one APK fits every phone.
#   - If a Google Play service account secret is set (PLAY_STORE_SERVICE_ACCOUNT
#     or GOOGLE_SERVICE_ACCOUNT_JSON): also an AAB, uploaded to Google Play
#     (internal testing track; falls back to a draft if Play refuses to roll it
#     out). Without that secret the Play steps are skipped.
#   - If App Store Connect secrets are set (APP_STORE_CONNECT_API_KEY_ID,
#     APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY = the .p8 file
#     contents, APPLE_TEAM_ID): an iOS build uploaded to App Store Connect /
#     TestFlight. Signing is automatic through the API key (Admin or App
#     Manager role).
#
# The app loads the live web app, so web changes reach users without a
# release. Release only when apps/mobile (native code, config, icons, sounds)
# changes.
#
# Secrets / variables:
#   KAVIO_APP_URL (variable or secret): production origin, e.g. https://kavio.cm
#   GOOGLE_SERVICES_JSON: Firebase Android config (raw JSON or base64); without
#     it the APK installs but never receives push notifications
#   GOOGLE_SERVICE_INFO_PLIST: Firebase iOS config (raw or base64)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#     ANDROID_KEY_PASSWORD: release signing; without them the APK is
#     debug-signed and the Play upload is skipped
#   PLAY_STORE_SERVICE_ACCOUNT, APP_STORE_CONNECT_*, APPLE_TEAM_ID: optional
# Bumping from the Run-workflow button pushes a commit to main as
# github-actions[bot]: needs Settings -> Actions -> Workflow permissions =
# "Read and write", and branch protection (if any) must allow that bot.

on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (rebuild = build the current version again)'
        type: choice
        options: [patch, minor, major, rebuild]
        default: patch
      app_url:
        description: 'Kavio origin the app loads (blank = KAVIO_APP_URL variable)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  PNPM_VERSION: '11.8.0'
  NODE_VERSION: '22'

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.r.outputs.build }}
      ios: ${{ steps.ios.outputs.ios }}
      version: ${{ steps.r.outputs.version }}
      code: ${{ steps.r.outputs.code }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Decide what to build
        id: r
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --quiet
          ver() { node -p "require('./package.json').version"; }

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $REF_NAME is not on main. Merge to main first, then tag."
              exit 1
            fi
            VERSION="${REF_NAME#v}"
            SHA="$GITHUB_SHA"
            [ "$(ver)" = "$VERSION" ] || echo "::warning::package.json says $(ver) but tag is $REF_NAME; building as $VERSION."

          elif [ "$EVENT" = "push" ]; then
            VERSION="$(ver)"
            SHA="$GITHUB_SHA"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Version $VERSION is already released (tag exists) - nothing to build."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -a "v$VERSION" -m "Release v$VERSION" "$SHA"
            git push origin "v$VERSION"

          else
            git checkout -q main && git pull -q --ff-only origin main
            if [ "$BUMP" = "rebuild" ]; then
              VERSION="$(ver)"
            else
              node scripts/bump-version.mjs "$BUMP"
              VERSION="$(ver)"
              if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
                echo "::error::Tag v$VERSION already exists."
                exit 1
              fi
              git add package.json apps/*/package.json
              git commit -m "chore(release): v$VERSION"
              git push origin main
              git tag -a "v$VERSION" -m "Release v$VERSION"
              git push origin "v$VERSION"
            fi
            SHA="$(git rev-parse HEAD)"
          fi

          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "Building version $VERSION (code $CODE) at $SHA"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The iOS job runs on a (10x more expensive) macOS runner, so only start
      # it when all App Store Connect secrets are present.
      - name: Check App Store secrets
        id: ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ] && [ -n "$TEAM" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "App Store Connect secrets not set - skipping iOS."
          fi

  android:
    name: Android v${{ needs.resolve.outputs.version }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      KAVIO_APP_URL: ${{ inputs.app_url || vars.KAVIO_APP_URL || secrets.KAVIO_APP_URL }}
      PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version to v${{ env.VERSION }}
        run: node scripts/bump-version.mjs "$VERSION"

      - name: Check the app URL
        run: |
          if [ -z "$KAVIO_APP_URL" ]; then
            echo "::warning::KAVIO_APP_URL is not set - the app will load the default in apps/mobile/capacitor.config.ts."
          fi

      # Firebase client config is per environment and git-ignored.
      - name: Write google-services.json
        id: firebase
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          DEST=apps/mobile/android/app/google-services.json
          if [ -z "$GSJ" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICES_JSON secret missing - the app will install but never receive push notifications."
            exit 0
          fi
          if printf '%s' "$GSJ" | head -c 1 | grep -q '{'; then
            printf '%s' "$GSJ" > "$DEST"
          else
            printf '%s' "$GSJ" | base64 -d > "$DEST"
          fi
          node -e "JSON.parse(require('fs').readFileSync('$DEST','utf8'))"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Copies capacitor.config (with KAVIO_APP_URL), the offline page and the
      # plugin list into the native project (those files are git-ignored).
      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm exec cap sync android

      - name: Prepare signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_* secrets missing - APK is debug-signed and Google Play upload is skipped."
            exit 0
          fi
          KS_FILE="$RUNNER_TEMP/release.jks"
          echo "$KS_B64" | base64 -d > "$KS_FILE"
          {
            echo "ANDROID_KEYSTORE_FILE=$KS_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Decide on Google Play upload
        id: play
        env:
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ "$SIGNED" = "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            [ -z "$PLAY_JSON" ] && echo "No Google Play service account secret - building the APK only."
          fi

      - name: Build APK${{ steps.play.outputs.upload == 'true' && ' and AAB' || '' }}
        working-directory: apps/mobile/android
        env:
          TASKS: assembleRelease${{ steps.play.outputs.upload == 'true' && ' bundleRelease' || '' }}
        run: |
          chmod +x gradlew
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Collect files
        id: files
        run: |
          OUT=apps/mobile/android/app/build/outputs
          BASE="Kavio-v$VERSION"
          mkdir -p dist
          cp "$OUT/apk/release/app-release.apk" "dist/$BASE.apk"
          if [ -f "$OUT/bundle/release/app-release.aab" ]; then
            cp "$OUT/bundle/release/app-release.aab" "dist/$BASE.aab"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          ls -lh dist

      # Fails the build if an APK is unsigned or corrupt, and prints what a
      # phone checks at install: signer, package, version and SDK levels.
      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          {
            echo "### APK check"
            for apk in dist/*.apk; do
              echo "**$(basename "$apk")** ($(du -h "$apk" | cut -f1))"
              echo '```'
              "$BT/apksigner" verify --print-certs -v "$apk" \
                | grep -E "^Verified using v[0-9]+ scheme|^Signer #1 certificate (DN|SHA-256)" || true
              "$BT/aapt2" dump badging "$apk" \
                | grep -E "^package:|^(min|target)SdkVersion|^native-code" || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            "$BT/apksigner" verify "$apk"
            if "$BT/apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::warning::$(basename "$apk") is debug-signed. It will not update a release-signed install."
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          # Upload the file itself, not a zip: the download is the .apk/.aab.
          archive: false
          name: ${{ steps.files.outputs.base }}.apk
          path: dist/${{ steps.files.outputs.base }}.apk
          retention-days: 30
          compression-level: 0

      - name: Upload AAB
        if: steps.play.outputs.upload == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Upload the file itself, not a zip: the download is the .apk/.aab.
          archive: false
          name: ${{ steps.files.outputs.base }}.aab
          path: dist/${{ steps.files.outputs.base }}.aab
          retention-days: 30
          compression-level: 0

      # Most apps: Play sends the change for review itself, and refuses the
      # request if changesNotSentForReview is set. Apps with managed publishing
      # need the flag instead, so retry with it only if the first try fails.
      - name: Upload to Google Play (internal testing)
        id: play_completed
        if: steps.play.outputs.upload == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.kavio.app
          releaseFiles: dist/${{ steps.files.outputs.base }}.aab
          track: internal
          status: completed

      - name: Upload to Google Play (managed publishing)
        id: play_held
        if: steps.play.outputs.upload == 'true' && steps.play_completed.outcome == 'failure'
        continue-on-error: true
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.kavio.app
          releaseFiles: dist/${{ steps.files.outputs.base }}.aab
          track: internal
          status: completed
          changesNotSentForReview: true

      # Play refuses "completed" while the app itself is still a draft.
      - name: Upload to Google Play (draft fallback)
        id: play_draft
        if: steps.play.outputs.upload == 'true' && steps.play_completed.outcome == 'failure' && steps.play_held.outcome == 'failure'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.kavio.app
          releaseFiles: dist/${{ steps.files.outputs.base }}.aab
          track: internal
          status: draft

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kavio v$VERSION (Android)"
            echo "- Share **${{ steps.files.outputs.base }}.apk** (works on every phone). Download it from *Artifacts* below."
            [ "${{ steps.key.outputs.signed }}" = "true" ] && echo "- Signed with the release key." || echo "- **Debug-signed** (ANDROID_KEYSTORE_* secrets missing)."
            [ "${{ steps.firebase.outputs.present }}" = "true" ] && echo "- Push notifications: Firebase config included." || echo "- Push notifications: **off** (GOOGLE_SERVICES_JSON missing)."
            [ -n "$KAVIO_APP_URL" ] && echo "- Loads: $KAVIO_APP_URL/app" || echo "- Loads: the default URL in capacitor.config.ts (**KAVIO_APP_URL not set**)."
            if [ "${{ steps.play.outputs.upload }}" != "true" ]; then
              echo "- Google Play: skipped (no service account secret or no release key)."
            elif [ "${{ steps.play_completed.outcome }}" = "success" ]; then
              echo "- Google Play: uploaded to **internal testing** (rolled out)."
            elif [ "${{ steps.play_held.outcome }}" = "success" ]; then
              echo "- Google Play: uploaded to **internal testing**; send the change for review in Play Console (managed publishing)."
            elif [ "${{ steps.play_draft.outcome }}" = "success" ]; then
              echo "- Google Play: uploaded to internal testing as a **draft** (finish it in Play Console)."
            else
              echo "- Google Play: **upload failed** - see the step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS v${{ needs.resolve.outputs.version }} (App Store)
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && needs.resolve.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.code }}
      KAVIO_APP_URL: ${{ inputs.app_url || vars.KAVIO_APP_URL || secrets.KAVIO_APP_URL }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version to v${{ env.VERSION }}
        run: node scripts/bump-version.mjs "$VERSION"

      - name: Write GoogleService-Info.plist
        id: firebase
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          DEST=apps/mobile/ios/App/App/GoogleService-Info.plist
          if [ -z "$PLIST" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICE_INFO_PLIST secret missing - iOS push notifications will not work."
            exit 0
          fi
          if printf '%s' "$PLIST" | head -c 5 | grep -q '<'; then
            printf '%s' "$PLIST" > "$DEST"
          else
            printf '%s' "$PLIST" | base64 -d > "$DEST"
          fi
          plutil -lint "$DEST"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # ios/ is committed (Capacitor 8, Swift Package Manager); sync only
      # refreshes the config, web assets and the plugin package list.
      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm exec cap sync ios

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # destination=upload sends the build straight to App Store Connect
      # (it shows up in TestFlight after Apple finishes processing).
      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Kavio v$VERSION (iOS, build $BUILD_NUMBER)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Uploaded to **App Store Connect**. It appears in TestFlight once Apple finishes processing (usually 5-30 min)."
            else
              echo "- iOS build/upload **failed** - see the step logs."
            fi
            [ "${{ steps.firebase.outputs.present }}" = "true" ] && echo "- Firebase config included (push also needs FirebaseMessaging added in Xcode, see docs/mobile/README.md)." || echo "- Push notifications: **off** (GOOGLE_SERVICE_INFO_PLIST missing)."
          } >> "$GITHUB_STEP_SUMMARY"
