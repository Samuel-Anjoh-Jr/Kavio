apply plugin: 'com.android.application'

/**
 * App version comes from apps/mobile/package.json, which
 * scripts/bump-version.mjs keeps equal to the root package.json version.
 * versionCode = MAJOR*10000 + MINOR*100 + PATCH (e.g. 1.2.3 -> 10203), so it
 * always grows when the version grows (required by Android and Google Play).
 */
def appVersionName = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def appVersionParts = appVersionName.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

android {
    namespace = "com.kavio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kavio.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release key comes from env vars (set by .github/workflows/mobile-release.yml
        // from GitHub secrets) or gradle properties. Never commit the keystore.
        def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE') ?: findProperty('ANDROID_KEYSTORE_FILE')
        if (releaseStoreFile && file(releaseStoreFile).exists()) {
            release {
                storeFile file(releaseStoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: findProperty('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: findProperty('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: findProperty('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Uses the real release key when one is provided, otherwise falls
            // back to the debug key (installable, but not for Google Play).
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Native alerts (alerts/AlertMessagingService) read FCM messages directly.
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
