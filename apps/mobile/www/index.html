<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kavio</title>
    <style>
      :root { color-scheme: light dark; --indigo: #3d5afe; --bg: #f8f9fc; --fg: #1b1e2e; --muted: #5b6075; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1e2e; --fg: #f3f4f8; --muted: #a3a8bd; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: var(--muted); max-width: 320px; line-height: 1.5; }
      button { margin-top: 8px; border: 0; border-radius: 14px; padding: 14px 24px; background: var(--indigo); color: #fff; font-size: 16px; font-weight: 600; }
      .mark { width: 64px; height: 64px; border-radius: 20px; background: var(--indigo); color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Pas de connexion · No connection</h1>
      <p>Kavio a besoin d'Internet la première fois. Vérifiez votre connexion puis réessayez.</p>
      <p>Kavio needs the internet the first time. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Réessayer · Retry</button>
    </main>
  </body>
</html>
