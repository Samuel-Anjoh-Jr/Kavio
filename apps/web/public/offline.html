<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kavio</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #f8f9fc;
        color: #1b1e2e;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1e2e;
          color: #f8f9fc;
        }
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 16px;
        background: #3d5afe;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #5c6280;
        margin: 0;
        max-width: 320px;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #a6acc5;
        }
      }
      [data-lang='fr'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 12.75l6 6 9-13.5" />
        </svg>
      </div>
      <div data-lang="en">
        <h1>You're offline</h1>
        <p>Kavio can't reach the network right now. Check your connection and try again.</p>
      </div>
      <div data-lang="fr">
        <h1>Vous êtes hors ligne</h1>
        <p>Kavio n'arrive pas à joindre le réseau. Vérifiez votre connexion et réessayez.</p>
      </div>
    </div>
    <script>
      // The app's language comes from the URL (/fr/app/...), which the worker
      // keeps when it serves this page; the phone's language is only a
      // fallback. Someone using Kavio in French on an English phone used to
      // get this page in English.
      (function () {
        var fromPath = (location.pathname.split('/')[1] || '').toLowerCase();
        var lang =
          fromPath === 'fr' || fromPath === 'en'
            ? fromPath
            : (navigator.language || '').toLowerCase().indexOf('fr') === 0
              ? 'fr'
              : 'en';
        if (lang === 'fr') {
          document.documentElement.lang = 'fr';
          document.title = 'Kavio, hors ligne';
          document.querySelector('[data-lang="en"]').style.display = 'none';
          document.querySelector('[data-lang="fr"]').style.display = 'block';
        }
      })();
    </script>
  </body>
</html>
